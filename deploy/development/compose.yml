# Merge with deploy/compose/compose.yml. Secrets stay in the server's protected files.
name: creatorhive-preview
networks:
  buzz-net:
    enable_ipv6: true
services:
  relay:
    image: ${CREATORHIVE_RUNTIME_IMAGE:?pinned runtime image required}
    environment:
      DATABASE_URL: ${DATABASE_URL:?restricted Supabase runtime URL required}
      BUZZ_AUTO_MIGRATE: "false"
      RELAY_URL: wss://api-dev.creatorhive.ai
      BUZZ_MANAGED_RELAY_URL: wss://api-dev.creatorhive.ai
      BUZZ_MEDIA_BASE_URL: https://api-dev.creatorhive.ai/media
      BUZZ_MANAGED_HTTP_ORIGINS: https://api-dev.creatorhive.ai,https://dev.creatorhive.ai,http://localhost:5173
      BUZZ_CORS_ORIGINS: https://dev.creatorhive.ai,http://localhost:5173
      BUZZ_WEB_DIR: /srv/creatorhive-release
    ports: !override
      - "127.0.0.1:3300:3000"
    volumes:
      - ./releases/${RELEASE_ID:?release required}/buzz-relay:/usr/local/bin/buzz-relay:ro
      - ./releases/${RELEASE_ID}/public:/srv/creatorhive-release:ro
      - ./certs:/opt/creatorhive-preview/certs:ro
    depends_on: !override
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    cpus: 1
    mem_limit: 1g
  postgres:
    profiles: [unused-local-database]
  redis:
    cpus: 0.25
    mem_limit: 128m
  minio:
    cpus: 0.5
    mem_limit: 512m
  agentkeeper:
    image: ${CREATORHIVE_RUNTIME_IMAGE:?pinned runtime image required}
    entrypoint: /usr/local/bin/agentkeeper
    network_mode: host
    user: "1000:1000"
    env_file: [agentkeeper.env]
    environment:
      AK_RELAY_HTTP: https://api-dev.creatorhive.ai
      AK_RELAY_WS: wss://api-dev.creatorhive.ai
      CH_SESSION_VALIDATION_URL: https://api-dev.creatorhive.ai/api/identity/session
      AK_PUBLIC_URLS: https://api-dev.creatorhive.ai,https://dev.creatorhive.ai,http://localhost:5173
      SSL_CERT_FILE: ""
    volumes:
      - ./releases/${RELEASE_ID}/agentkeeper:/usr/local/bin/agentkeeper:ro
      - ./keeper-data:/var/lib/agentkeeper
      - ./certs:/opt/creatorhive-preview/certs:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
  cloudflared:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: [tunnel, --no-autoupdate, run, --token-file, /run/cloudflared.token]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./cloudflared.token:/run/cloudflared.token:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
